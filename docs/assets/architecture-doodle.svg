<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">DataSentinel architecture — evidence to recovery</title><desc id="desc">Next.js dashboard on Vercel calls FastAPI on Render. A single-process workflow coordinates pipeline execution, profiling, detection, investigation, remediation, validation and reporting. A generated Git repository and persistent JSON/artifacts supply evidence and state. Optional LLM explanations are grounded; failed validation permits operator rollback and retry.</desc>
