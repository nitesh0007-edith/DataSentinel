<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">DataSentinel — successful pipeline, unhealthy data</title><desc id="desc">Notebook-style illustration of a successful run losing Germany and Italy, followed by deterministic detection, Git evidence, an approved patch, validation and the dashboard. Illustration, not a screenshot.</desc>
